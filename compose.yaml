name: ${COMPOSE_PROJECT_NAME:-ai-collaboration-observability}
services:
  source-storage-init:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.1.3}
    user: 0:0
    entrypoint: [sh, -c]
    command: ["chown 10001:10001 /source && chmod 700 /source"]
    network_mode: none
    restart: 'no'
    volumes:
    - collector-source-data:/source
  source-archive:
    image: ${SOURCE_ARCHIVE_IMAGE:-python:3.13.7-alpine3.22}
    user: 10001:10001
    command: [python, /app/source_archive_server.py]
    restart: unless-stopped
    read_only: true
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_ARCHIVE_DIR: /var/lib/otelcol/source
    volumes:
    - ./scripts/source_archive_server.py:/app/source_archive_server.py:ro
    - collector-source-data:/var/lib/otelcol/source
    depends_on:
      source-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4320/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
    - observability
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.158.0}
    command:
    - --config=/etc/otelcol/config.yaml
    restart: unless-stopped
    volumes:
    - ./config/otel-collector/core.yaml:/etc/otelcol/config.yaml:ro
    ports:
    - 127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317
    - 127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318
    - 127.0.0.1:${OTEL_HEALTH_PORT:-13133}:13133
    expose:
    - '8888'
    - '8889'
    depends_on:
      source-archive:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks:
    - observability
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.2}
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-14d}
    restart: unless-stopped
    volumes:
    - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./config/prometheus/rules:/etc/prometheus/rules:ro
    - prometheus-data:/prometheus
    ports:
    - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    depends_on:
    - otel-collector
    networks:
    - observability
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.7.6}
    command:
    - -config.file=/etc/loki/loki.yml
    restart: unless-stopped
    volumes:
    - ./config/loki/loki.yml:/etc/loki/loki.yml:ro
    - loki-data:/loki
    ports:
    - 127.0.0.1:${LOKI_PORT:-3100}:3100
    networks:
    - observability
  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:3.0.2}
    command:
    - -config.file=/etc/tempo/tempo.yml
    restart: unless-stopped
    volumes:
    - ./config/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    - tempo-data:/var/tempo
    ports:
    - 127.0.0.1:${TEMPO_PORT:-3200}:3200
    expose:
    - '4317'
    - '4318'
    networks:
    - observability
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.1.3}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local-only}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_PLUGINS_CHECK_FOR_UPDATES: 'false'
      GF_UNIFIED_ALERTING_ENABLED: 'true'
    volumes:
    - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    - grafana-data:/var/lib/grafana
    ports:
    - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    depends_on:
    - prometheus
    - loki
    - tempo
    networks:
    - observability
networks:
  observability:
    driver: bridge
volumes:
  collector-source-data: null
  grafana-data: null
  loki-data: null
  prometheus-data: null
  tempo-data: null
