extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 384
    spike_limit_mib: 96
  resource/normalize:
    attributes:
    - key: ai_context.environment.profile
      value: corporate-redacted
      action: upsert
    - key: ai_observability.profile
      value: corporate-redacted
      action: upsert
    - key: deployment.environment.name
      value: corporate-local
      action: upsert
    - key: service.name
      value: unknown-ai-client
      action: insert
  transform/privacy_initial:
    error_mode: propagate
    trace_statements:
    - context: resource
      statements:
      - 'delete_matching_keys(attributes, "(?i)(^|[._-])(arguments?|args|result|payload|prompt(?:[._-](?:content|text|length))?|completion|response|messages?|content|reasoning[._-]summary|tool[._-](?:arguments?|args|result|output|input|name)|mcp[._-](?:arguments?|result|payload|server|servers|server[._-]origin)|conversation[._-]id|request[._-]id|call[._-]id|trace[._-]id|span[._-]id|account[._-]id|user[._-]account[._-]id|endpoint|host[._-]name|path|branch|commit|email|secret|password|access[._-]?token)([._-]|$)")'
    - context: scope
      statements:
      - 'delete_matching_keys(attributes, ".*")'
    - context: span
      statements:
      - 'delete_matching_keys(attributes, "(?i)(^|[._-])(arguments?|args|result|payload|prompt|completion|response|messages?|content|reasoning[._-]summary|tool[._-](?:arguments?|args|result|output|input|name)|mcp[._-](?:arguments?|result|payload|server|servers|server[._-]origin)|conversation[._-]id|request[._-]id|call[._-]id|trace[._-]id|span[._-]id|account[._-]id|user[._-]account[._-]id|endpoint|host[._-]name|path|branch|commit|email|secret|password|access[._-]?token)([._-]|$)")'
    - context: spanevent
      statements:
      - 'delete_matching_keys(attributes, "(?i)(^|[._-])(arguments?|args|result|payload|prompt|completion|response|messages?|content|reasoning[._-]summary|tool[._-](?:arguments?|args|result|output|input|name)|conversation[._-]id|request[._-]id|call[._-]id|trace[._-]id|span[._-]id|account[._-]id|user[._-]account[._-]id|endpoint|path|email|secret|password|access[._-]?token)([._-]|$)")'
    log_statements:
    - context: resource
      statements:
      - 'delete_matching_keys(attributes, "(?i)(^|[._-])(arguments?|args|result|payload|prompt(?:[._-](?:content|text|length))?|completion|response|messages?|content|reasoning[._-]summary|tool[._-](?:arguments?|args|result|output|input|name)|mcp[._-](?:arguments?|result|payload|server|servers|server[._-]origin)|conversation[._-]id|request[._-]id|call[._-]id|trace[._-]id|span[._-]id|account[._-]id|user[._-]account[._-]id|endpoint|host[._-]name|path|branch|commit|email|secret|password|access[._-]?token)([._-]|$)")'
    - context: scope
      statements:
      - 'delete_matching_keys(attributes, ".*")'
    - context: log
      statements:
      - 'delete_matching_keys(attributes, "(?i)(^|[._-])(arguments?|args|result|payload|prompt|completion|response|messages?|content|reasoning[._-]summary|tool[._-](?:arguments?|args|result|output|input|name)|mcp[._-](?:arguments?|result|payload|server|servers|server[._-]origin)|conversation[._-]id|request[._-]id|call[._-]id|trace[._-]id|span[._-]id|account[._-]id|user[._-]account[._-]id|endpoint|host[._-]name|path|branch|commit|email|secret|password|access[._-]?token)([._-]|$)")'
    metric_statements:
    - context: resource
      statements:
      - 'delete_matching_keys(attributes, "(?i)(conversation[._-]id|request[._-]id|call[._-]id|trace[._-]id|span[._-]id|account[._-]id|user[._-]account[._-]id|absolute[._-]?path|repository[._-]name|branch|commit)")'
    - context: scope
      statements:
      - 'delete_matching_keys(attributes, ".*")'
    - context: datapoint
      statements:
      - 'delete_matching_keys(attributes, "(?i)(conversation[._-]id|request[._-]id|call[._-]id|trace[._-]id|span[._-]id|account[._-]id|user[._-]account[._-]id|absolute[._-]?path|repository[._-]name|branch|commit)")'
  transform/ai_agent:
    error_mode: propagate
    trace_statements:
    - context: resource
      statements:
      - set(attributes["ai_agent.provider"], "openai") where attributes["service.name"] == "codex-app-server"
      - set(attributes["ai_agent.product"], "codex") where attributes["service.name"] == "codex-app-server"
      - set(attributes["ai_agent.surface"], "app-server") where attributes["service.name"] == "codex-app-server"
    log_statements:
    - context: resource
      statements:
      - set(attributes["ai_agent.provider"], "openai") where attributes["service.name"] == "codex-app-server"
      - set(attributes["ai_agent.product"], "codex") where attributes["service.name"] == "codex-app-server"
      - set(attributes["ai_agent.surface"], "app-server") where attributes["service.name"] == "codex-app-server"
    metric_statements:
    - context: resource
      statements:
      - set(attributes["ai_agent.provider"], "openai") where attributes["service.name"] == "codex-app-server"
      - set(attributes["ai_agent.product"], "codex") where attributes["service.name"] == "codex-app-server"
      - set(attributes["ai_agent.surface"], "app-server") where attributes["service.name"] == "codex-app-server"
    - context: metric
      statements:
      - copy_metric(name="ai_agent.turn.token_usage") where name == "codex.turn.token_usage"
      - copy_metric(name="ai_agent.turn.duration_ms") where name == "codex.turn.e2e_duration_ms"
      - copy_metric(name="ai_agent.turn.ttft.duration_ms") where name == "codex.turn.ttft.duration_ms"
      - copy_metric(name="ai_agent.turn.ttfm.duration_ms") where name == "codex.turn.ttfm.duration_ms"
      - copy_metric(name="ai_agent.tool.call") where name == "codex.tool.call"
      - copy_metric(name="ai_agent.tool.call.duration_ms") where name == "codex.tool.call.duration_ms"
      - copy_metric(name="ai_agent.mcp.call") where name == "codex.mcp.call"
      - copy_metric(name="ai_agent.mcp.call.duration_ms") where name == "codex.mcp.call.duration_ms"
      - copy_metric(name="ai_agent.api.inference.duration_ms") where name == "codex.responses_api_inference_time.duration_ms"
      - copy_metric(name="ai_agent.api.overhead.duration_ms") where name == "codex.responses_api_overhead.duration_ms"
      - copy_metric(name="ai_agent.compaction") where name == "codex.task.compact"
      - copy_metric(name="ai_agent.skill.injection") where name == "codex.skill.injected"
      - copy_metric(name="ai_agent.thread.started") where name == "codex.thread.started"
      - copy_metric(name="ai_agent.observed.session_tokens") where name == "antigravity_session_tokens"
      - copy_metric(name="ai_agent.observed.context_tokens") where name == "antigravity_context_tokens"
      - copy_metric(name="ai_agent.observed.context_used_ratio") where name == "antigravity_context_used_ratio"
      - copy_metric(name="ai_agent.observed.quota_remaining_ratio") where name == "antigravity_quota_remaining_ratio"
      - copy_metric(name="ai_agent.observed.background_task_count") where name == "antigravity_background_task_count"
      - copy_metric(name="ai_agent.observed.artifact_count") where name == "antigravity_artifact_count"
      - copy_metric(name="ai_agent.observed.context_exceeds_200k") where name == "antigravity_context_exceeds_200k"
      - copy_metric(name="ai_agent.observed.pending_input_count") where name == "antigravity_pending_input_count"
      - copy_metric(name="ai_agent.observed.tool_confirmation_pending") where name == "antigravity_tool_confirmation_pending"
    - context: datapoint
      statements:
      - set(attributes["model_family"], "unmapped") where IsMatch(metric.name, "^ai_agent\\.") and resource.attributes["service.name"] == "codex-app-server"
      - set(attributes["model_id"], "unmapped") where IsMatch(metric.name, "^ai_agent\\.") and resource.attributes["service.name"] == "codex-app-server"
      - set(attributes["model_family"], "gpt-5.6") where IsMatch(metric.name, "^ai_agent\\.") and (attributes["model"] == "gpt-5.6" or IsMatch(attributes["model"], "^gpt-5\\.6-"))
      - set(attributes["model_family"], "codex-auto-review") where IsMatch(metric.name, "^ai_agent\\.") and attributes["model"] == "codex-auto-review"
      - set(attributes["model_id"], "gpt-5.6-sol") where IsMatch(metric.name, "^ai_agent\\.") and attributes["model"] == "gpt-5.6-sol"
      - set(attributes["model_id"], "gpt-5.6-terra") where IsMatch(metric.name, "^ai_agent\\.") and attributes["model"] == "gpt-5.6-terra"
      - set(attributes["model_id"], "gpt-5.6-luna") where IsMatch(metric.name, "^ai_agent\\.") and attributes["model"] == "gpt-5.6-luna"
      - set(attributes["model_id"], "codex-auto-review") where IsMatch(metric.name, "^ai_agent\\.") and attributes["model"] == "codex-auto-review"
      - set(attributes["operation"], "turn") where IsMatch(metric.name, "^ai_agent\\.turn\\.")
      - set(attributes["operation"], "tool") where IsMatch(metric.name, "^ai_agent\\.tool\\.")
      - set(attributes["operation"], "mcp") where IsMatch(metric.name, "^ai_agent\\.mcp\\.")
      - set(attributes["operation"], "api") where IsMatch(metric.name, "^ai_agent\\.api\\.")
      - set(attributes["evidence_class"], "provider-reported") where IsMatch(metric.name, "^ai_agent\\.") and resource.attributes["service.name"] == "codex-app-server"
      - set(attributes["evidence_class"], "observed") where IsMatch(metric.name, "^ai_agent\\.observed\\.")
      - set(attributes["tool_category"], "execution") where IsMatch(metric.name, "^ai_agent\\.tool\\.") and attributes["tool"] == "exec"
      - set(attributes["tool_category"], "execution") where IsMatch(metric.name, "^ai_agent\\.tool\\.") and attributes["tool"] == "exec_command"
      - set(attributes["tool_category"], "editor") where IsMatch(metric.name, "^ai_agent\\.tool\\.") and attributes["tool"] == "apply_patch"
      - set(attributes["tool_category"], "connector") where IsMatch(metric.name, "^ai_agent\\.tool\\.") and IsMatch(attributes["tool"], "^[a-z0-9_]+\\.")
      - delete_key(attributes, "model") where IsMatch(metric.name, "^ai_agent\\.")
      - delete_key(attributes, "tool") where IsMatch(metric.name, "^ai_agent\\.")
      - delete_key(attributes, "tool_name") where IsMatch(metric.name, "^ai_agent\\.")
      - delete_key(attributes, "skill") where IsMatch(metric.name, "^ai_agent\\.")
  batch/logs:
    timeout: 2s
    send_batch_size: 512
    send_batch_max_size: 1024
  batch/metrics:
    timeout: 2s
    send_batch_size: 512
    send_batch_max_size: 1024
  batch/traces:
    timeout: 2s
    send_batch_size: 512
    send_batch_max_size: 1024
  transform/corporate_allowlist:
    error_mode: propagate
    trace_statements:
    - context: resource
      statements:
      - keep_keys(attributes, ["service.name", "service.namespace", "service.version", "deployment.environment.name", "telemetry.sdk.name", "telemetry.sdk.language", "telemetry.sdk.version",
        "ai_observability.profile", "ai_agent.provider", "ai_agent.product", "ai_agent.surface", "ai_context.environment.profile", "ai_context.framework.name", "ai_context.framework.version", "ai_context.workflow.type", "ai_context.workflow.stage",
        "ai_context.task.type", "ai_context.tool.category", "ai_context.model.family", "ai_context.evidence.class"])
    - context: scope
      statements:
      - 'delete_matching_keys(attributes, ".*")'
    - context: span
      statements:
      - keep_keys(attributes, ["event.name", "gen_ai.operation.name", "gen_ai.provider.name", "gen_ai.request.model", "gen_ai.response.model", "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens",
        "gen_ai.usage.cached_input_tokens", "gen_ai.usage.reasoning_tokens", "ai_context.operation.type", "ai_context.framework.version", "ai_context.workflow.type", "ai_context.workflow.stage",
        "ai_context.task.type", "ai_context.skill.id", "ai_context.rule.id", "ai_context.rule.state", "ai_context.context.loaded_files", "ai_context.context.loaded_bytes", "ai_context.context.estimated_tokens",
        "ai_context.validation.type", "ai_context.validation.tier", "ai_context.validation.fingerprint_hash", "ai_context.validation.reused", "ai_context.validation.invalidation_reason",
        "ai_context.retry.count", "ai_context.retry.reason", "ai_context.state", "ai_context.wait.reason", "ai_context.outcome", "ai_context.evidence.class", "ai_context.manual_correction",
        "ai_context.tool.category", "ai_context.model.family", "ai_context.token.type", "ai_context.error.category", "ai_context.duration.bucket", "ai_context.cost.value", "ai_context.cost.unit",
        "ai_context.cost.source", "ai_context.cost.rate_card.version", "ai_context.cost.attribution.confidence", "ai_agent.operation", "ai_agent.tool.category", "ai_agent.model.family",
        "ai_agent.evidence.class", "duration_ms", "success", "error.type"])
      - set(name, "AI telemetry operation")
      - set(status.message, "")
      - set(trace_state, "")
    - context: spanevent
      statements:
      - keep_keys(attributes, ["event.name", "gen_ai.operation.name", "gen_ai.provider.name", "gen_ai.request.model", "gen_ai.response.model", "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens",
        "gen_ai.usage.cached_input_tokens", "gen_ai.usage.reasoning_tokens", "ai_context.operation.type", "ai_context.framework.version", "ai_context.workflow.type", "ai_context.workflow.stage",
        "ai_context.task.type", "ai_context.skill.id", "ai_context.rule.id", "ai_context.rule.state", "ai_context.context.loaded_files", "ai_context.context.loaded_bytes", "ai_context.context.estimated_tokens",
        "ai_context.validation.type", "ai_context.validation.tier", "ai_context.validation.fingerprint_hash", "ai_context.validation.reused", "ai_context.validation.invalidation_reason",
        "ai_context.retry.count", "ai_context.retry.reason", "ai_context.state", "ai_context.wait.reason", "ai_context.outcome", "ai_context.evidence.class", "ai_context.manual_correction",
        "ai_context.tool.category", "ai_context.model.family", "ai_context.token.type", "ai_context.error.category", "ai_context.duration.bucket", "ai_context.cost.value", "ai_context.cost.unit",
        "ai_context.cost.source", "ai_context.cost.rate_card.version", "ai_context.cost.attribution.confidence", "ai_agent.operation", "ai_agent.tool.category", "ai_agent.model.family",
        "ai_agent.evidence.class", "duration_ms", "success", "error.type"])
      - set(name, "AI telemetry event")
    log_statements:
    - context: resource
      statements:
      - keep_keys(attributes, ["service.name", "service.namespace", "service.version", "deployment.environment.name", "telemetry.sdk.name", "telemetry.sdk.language", "telemetry.sdk.version",
        "ai_observability.profile", "ai_agent.provider", "ai_agent.product", "ai_agent.surface", "ai_context.environment.profile", "ai_context.framework.name", "ai_context.framework.version", "ai_context.workflow.type", "ai_context.workflow.stage",
        "ai_context.task.type", "ai_context.tool.category", "ai_context.model.family", "ai_context.evidence.class"])
    - context: scope
      statements:
      - 'delete_matching_keys(attributes, ".*")'
    - context: log
      statements:
      - keep_keys(attributes, ["event.name", "gen_ai.operation.name", "gen_ai.provider.name", "gen_ai.request.model", "gen_ai.response.model", "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens",
        "gen_ai.usage.cached_input_tokens", "gen_ai.usage.reasoning_tokens", "ai_context.operation.type", "ai_context.framework.version", "ai_context.workflow.type", "ai_context.workflow.stage",
        "ai_context.task.type", "ai_context.skill.id", "ai_context.rule.id", "ai_context.rule.state", "ai_context.context.loaded_files", "ai_context.context.loaded_bytes", "ai_context.context.estimated_tokens",
        "ai_context.validation.type", "ai_context.validation.tier", "ai_context.validation.fingerprint_hash", "ai_context.validation.reused", "ai_context.validation.invalidation_reason",
        "ai_context.retry.count", "ai_context.retry.reason", "ai_context.state", "ai_context.wait.reason", "ai_context.outcome", "ai_context.evidence.class", "ai_context.manual_correction",
        "ai_context.tool.category", "ai_context.model.family", "ai_context.token.type", "ai_context.error.category", "ai_context.duration.bucket", "ai_context.cost.value", "ai_context.cost.unit",
        "ai_context.cost.source", "ai_context.cost.rate_card.version", "ai_context.cost.attribution.confidence", "ai_agent.operation", "ai_agent.tool.category", "ai_agent.model.family",
        "ai_agent.evidence.class", "duration_ms", "success", "error.type"])
      - set(body, "AI telemetry metadata event")
    metric_statements:
    - context: resource
      statements:
      - keep_keys(attributes, ["service.name", "service.namespace", "service.version", "deployment.environment.name", "ai_observability.profile", "ai_agent.provider", "ai_agent.product",
        "ai_agent.surface", "ai_context.environment.profile", "ai_context.framework.version", "ai_context.workflow.type", "ai_context.task.type"])
    - context: scope
      statements:
      - 'delete_matching_keys(attributes, ".*")'
    - context: metric
      statements:
      - set(description, "")
    - context: datapoint
      statements:
      - keep_keys(attributes, ["event.name", "tool", "tool_name", "tool_category", "model", "model_id", "model_family", "operation", "success", "status", "type", "token_type", "task_type", "workflow_type", "stage",
        "skill", "skill_id", "rule", "rule_id", "state", "outcome", "error_category", "evidence_class", "source", "unit", "tier", "reused", "reason", "framework_version", "validation_type", "validation_tier",
        "wait_reason", "cost_unit", "cost_source", "gen_ai.operation.name", "gen_ai.provider.name", "gen_ai.request.model", "gen_ai.response.model", "ai_context.environment.profile",
        "ai_context.framework.version", "ai_context.workflow.type", "ai_context.workflow.stage", "ai_context.task.type", "ai_context.skill.id", "ai_context.rule.id", "ai_context.rule.state",
        "ai_context.validation.type", "ai_context.validation.tier", "ai_context.validation.reused", "ai_context.retry.reason", "ai_context.wait.reason", "ai_context.outcome", "ai_context.evidence.class",
        "ai_context.tool.category", "ai_context.model.family", "ai_context.token.type", "ai_context.error.category", "ai_context.cost.unit", "ai_context.cost.source"])
    - context: exemplar
      statements:
      - keep_keys(filtered_attributes, ["ai_context.safe_exemplar_attribute"])
exporters:
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 2048
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    metric_expiration: 30m
    resource_to_telemetry_conversion:
      enabled: true
    enable_open_metrics: false
    without_scope_info: true
    translation_strategy: UnderscoreEscapingWithoutSuffixes
  otlp/tempo:
    endpoint: tempo:4317
    compression: gzip
    tls:
      insecure: true
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 2048
service:
  extensions:
  - health_check
  - zpages
  pipelines:
    logs:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource/normalize
      - transform/privacy_initial
      - transform/ai_agent
      - transform/corporate_allowlist
      - batch/logs
      exporters:
      - otlphttp/loki
    metrics:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource/normalize
      - transform/privacy_initial
      - transform/ai_agent
      - transform/corporate_allowlist
      - batch/metrics
      exporters:
      - prometheus
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource/normalize
      - transform/privacy_initial
      - transform/ai_agent
      - transform/corporate_allowlist
      - batch/traces
      exporters:
      - otlp/tempo
  telemetry:
    logs:
      level: warn
      encoding: json
    metrics:
      level: detailed
      readers:
      - pull:
          exporter:
            prometheus:
              host: 0.0.0.0
              port: 8888
