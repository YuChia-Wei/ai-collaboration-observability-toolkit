    - context: scope
      statements:
      - delete_key(attributes, "prompt")
      - delete_key(attributes, "completion")
      - delete_key(attributes, "response")
      - delete_key(attributes, "input")
      - delete_key(attributes, "output")
      - delete_key(attributes, "content")
      - delete_key(attributes, "message")
      - delete_key(attributes, "messages")
      - delete_key(attributes, "tool.arguments")
      - delete_key(attributes, "tool.result")
      - delete_key(attributes, "tool.output")
      - delete_key(attributes, "tool.input")
      - 'delete_matching_keys(attributes, "(?i)(^|\\.)(prompt\\.(?:content|text)|completion\\.(?:content|text)|messages?|content|input\\.(?:value|body|content|text|messages?)|output\\.(?:value|body|content|text|messages?)|response\\.(?:body|content|text|messages?)|gen_ai\\.(?:prompt|completion|input\\.(?:messages?|content|text)|output\\.(?:messages?|content|text)|response\\.(?:body|content|text))|openinference\\.(?:input|output)|tool(?:\\.call)?\\.(?:arguments|args|result|output|input)|mcp\\.(?:arguments|result|payload)|request\\.(?:body|headers?)|response\\.(?:body|headers?)|http\\.request\\.(?:body|headers?)|http\\.response\\.(?:body|headers?)|file\\.(?:path|content|name)|repository\\.(?:url|path|name)|code\\.(?:content|diff|filepath|file_path)|process\\.(?:command(?:_line)?|command_args|executable\\.path)|command\\.(?:line|output)|shell\\.command|db\\.(?:statement|query\\.text)|exception\\.(?:message|stacktrace)|error\\.message|url\\.(?:full|path|query)|http\\.(?:url|target)|user\\.(?:email|name)|email|account\\.id|organization\\.id|auth(?:orization)?|cookie|api[_-]?key|access[_-]?token|refresh[_-]?token|password|secret|absolute[_-]?path)(\\.|$)")'
