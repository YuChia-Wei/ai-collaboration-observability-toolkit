  batch/logs:
    timeout: 2s
    send_batch_size: 512
    send_batch_max_size: 1024
  batch/metrics:
    timeout: 2s
    send_batch_size: 512
    send_batch_max_size: 1024
  batch/traces:
    timeout: 2s
    send_batch_size: 512
    send_batch_max_size: 1024
  filter/phoenix-selected:
    error_mode: propagate
    traces:
      span:
      - resource.attributes["ai_context.export.phoenix"] != true
  batch/phoenix:
    timeout: 2s
    send_batch_size: 256
    send_batch_max_size: 512
exporters:
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 2048
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    metric_expiration: 30m
    resource_to_telemetry_conversion:
      enabled: true
    enable_open_metrics: false
    without_scope_info: true
    translation_strategy: UnderscoreEscapingWithoutSuffixes
  otlp/tempo:
    endpoint: tempo:4317
    compression: gzip
    tls:
      insecure: true
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 2048
  otlphttp/phoenix:
    endpoint: http://phoenix:6006
    headers:
      x-project-name: ai-collaboration-observability-fixture
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1024
service:
  extensions:
  - health_check
  - zpages
  pipelines:
    logs:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource/normalize
      - transform/privacy
      - batch/logs
      exporters:
      - otlphttp/loki
    metrics:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource/normalize
      - transform/privacy
      - batch/metrics
      exporters:
      - prometheus
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource/normalize
      - transform/privacy
      - batch/traces
      exporters:
      - otlp/tempo
    traces/phoenix:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource/normalize
      - transform/privacy
      - filter/phoenix-selected
      - batch/phoenix
      exporters:
      - otlphttp/phoenix
  telemetry:
    logs:
      level: warn
      encoding: json
    metrics:
      level: detailed
      readers:
      - pull:
          exporter:
            prometheus:
              host: 0.0.0.0
              port: 8888
