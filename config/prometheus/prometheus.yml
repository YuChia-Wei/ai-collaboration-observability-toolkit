global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    observability_stack: ai-collaboration-observability

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: otel-collector-internal
    static_configs:
      - targets: [otel-collector:8888]

  - job_name: otel-collector-exported
    static_configs:
      - targets: [otel-collector:8889]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]

  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
