groups:
  - name: ai-agent-token-accounting-and-estimates
    interval: 10s
    rules:
      # Public API list prices read back from each official GPT-5.6 model page
      # on 2026-08-12. Cache writes are explicitly listed at 1.25x uncached
      # input. These estimates are not Codex subscription or invoice prices.
      - record: ai_agent_token_price_usd_per_million
        expr: vector(5)
        labels:
          ai_agent_provider: openai
          model_id: gpt-5.6-sol
          usage_class: input_uncached
          currency: USD
          rate_card_version: openai-api-2026-08-12
          rate_card_source: official_openai_model_pages
          pricing_scope: base_standard_context
      - record: ai_agent_token_price_usd_per_million
        expr: vector(0.5)
        labels:
          ai_agent_provider: openai
          model_id: gpt-5.6-sol
          usage_class: input_cached
          currency: USD
          rate_card_version: openai-api-2026-08-12
          rate_card_source: official_openai_model_pages
          pricing_scope: base_standard_context
      - record: ai_agent_token_price_usd_per_million
        expr: vector(6.25)
        labels:
          ai_agent_provider: openai
          model_id: gpt-5.6-sol
          usage_class: input_cache_write
          currency: USD
          rate_card_version: openai-api-2026-08-12
          rate_card_source: official_openai_model_pages
          pricing_scope: base_standard_context
      - record: ai_agent_token_price_usd_per_million
        expr: vector(30)
        labels:
          ai_agent_provider: openai
          model_id: gpt-5.6-sol
          usage_class: output
          currency: USD
          rate_card_version: openai-api-2026-08-12
          rate_card_source: official_openai_model_pages
          pricing_scope: base_standard_context

      - record: ai_agent_token_price_usd_per_million
        expr: vector(2)
        labels:
          ai_agent_provider: openai
          model_id: gpt-5.6-terra
          usage_class: input_uncached
          currency: USD
          rate_card_version: openai-api-2026-08-12
          rate_card_source: official_openai_model_pages
          pricing_scope: base_standard_context
      - record: ai_agent_token_price_usd_per_million
        expr: vector(0.2)
        labels:
          ai_agent_provider: openai
          model_id: gpt-5.6-terra
          usage_class: input_cached
          currency: USD
          rate_card_version: openai-api-2026-08-12
          rate_card_source: official_openai_model_pages
          pricing_scope: base_standard_context
      - record: ai_agent_token_price_usd_per_million
        expr: vector(2.5)
        labels:
          ai_agent_provider: openai
          model_id: gpt-5.6-terra
          usage_class: input_cache_write
          currency: USD
          rate_card_version: openai-api-2026-08-12
          rate_card_source: official_openai_model_pages
          pricing_scope: base_standard_context
      - record: ai_agent_token_price_usd_per_million
        expr: vector(12)
        labels:
          ai_agent_provider: openai
          model_id: gpt-5.6-terra
          usage_class: output
          currency: USD
          rate_card_version: openai-api-2026-08-12
          rate_card_source: official_openai_model_pages
          pricing_scope: base_standard_context

      - record: ai_agent_token_price_usd_per_million
        expr: vector(0.2)
        labels:
          ai_agent_provider: openai
          model_id: gpt-5.6-luna
          usage_class: input_uncached
          currency: USD
          rate_card_version: openai-api-2026-08-12
          rate_card_source: official_openai_model_pages
          pricing_scope: base_standard_context
      - record: ai_agent_token_price_usd_per_million
        expr: vector(0.02)
        labels:
          ai_agent_provider: openai
          model_id: gpt-5.6-luna
          usage_class: input_cached
          currency: USD
          rate_card_version: openai-api-2026-08-12
          rate_card_source: official_openai_model_pages
          pricing_scope: base_standard_context
      - record: ai_agent_token_price_usd_per_million
        expr: vector(0.25)
        labels:
          ai_agent_provider: openai
          model_id: gpt-5.6-luna
          usage_class: input_cache_write
          currency: USD
          rate_card_version: openai-api-2026-08-12
          rate_card_source: official_openai_model_pages
          pricing_scope: base_standard_context
      - record: ai_agent_token_price_usd_per_million
        expr: vector(1.2)
        labels:
          ai_agent_provider: openai
          model_id: gpt-5.6-luna
          usage_class: output
          currency: USD
          rate_card_version: openai-api-2026-08-12
          rate_card_source: official_openai_model_pages
          pricing_scope: base_standard_context

      # Public Codex token-based credits rate card. It publishes input,
      # cached-input, and output rates only. Cache-write input deliberately has
      # no credit rate and stays visible through the unpriced recording rule.
      - record: ai_agent_token_credit_per_million
        expr: vector(125)
        labels:
          ai_agent_provider: openai
          model_id: gpt-5.6-sol
          usage_class: input_uncached
          credit_unit: credits
          rate_card_version: openai-codex-credits-2026-08-12
          rate_card_source: official_codex_pricing
          pricing_scope: published_token_classes
      - record: ai_agent_token_credit_per_million
        expr: vector(12.5)
        labels:
          ai_agent_provider: openai
          model_id: gpt-5.6-sol
          usage_class: input_cached
          credit_unit: credits
          rate_card_version: openai-codex-credits-2026-08-12
          rate_card_source: official_codex_pricing
          pricing_scope: published_token_classes
      - record: ai_agent_token_credit_per_million
        expr: vector(750)
        labels:
          ai_agent_provider: openai
          model_id: gpt-5.6-sol
          usage_class: output
          credit_unit: credits
          rate_card_version: openai-codex-credits-2026-08-12
          rate_card_source: official_codex_pricing
          pricing_scope: published_token_classes

      - record: ai_agent_token_credit_per_million
        expr: vector(50)
        labels:
          ai_agent_provider: openai
          model_id: gpt-5.6-terra
          usage_class: input_uncached
          credit_unit: credits
          rate_card_version: openai-codex-credits-2026-08-12
          rate_card_source: official_codex_pricing
          pricing_scope: published_token_classes
      - record: ai_agent_token_credit_per_million
        expr: vector(5)
        labels:
          ai_agent_provider: openai
          model_id: gpt-5.6-terra
          usage_class: input_cached
          credit_unit: credits
          rate_card_version: openai-codex-credits-2026-08-12
          rate_card_source: official_codex_pricing
          pricing_scope: published_token_classes
      - record: ai_agent_token_credit_per_million
        expr: vector(300)
        labels:
          ai_agent_provider: openai
          model_id: gpt-5.6-terra
          usage_class: output
          credit_unit: credits
          rate_card_version: openai-codex-credits-2026-08-12
          rate_card_source: official_codex_pricing
          pricing_scope: published_token_classes

      - record: ai_agent_token_credit_per_million
        expr: vector(5)
        labels:
          ai_agent_provider: openai
          model_id: gpt-5.6-luna
          usage_class: input_uncached
          credit_unit: credits
          rate_card_version: openai-codex-credits-2026-08-12
          rate_card_source: official_codex_pricing
          pricing_scope: published_token_classes
      - record: ai_agent_token_credit_per_million
        expr: vector(0.5)
        labels:
          ai_agent_provider: openai
          model_id: gpt-5.6-luna
          usage_class: input_cached
          credit_unit: credits
          rate_card_version: openai-codex-credits-2026-08-12
          rate_card_source: official_codex_pricing
          pricing_scope: published_token_classes
      - record: ai_agent_token_credit_per_million
        expr: vector(30)
        labels:
          ai_agent_provider: openai
          model_id: gpt-5.6-luna
          usage_class: output
          credit_unit: credits
          rate_card_version: openai-codex-credits-2026-08-12
          rate_card_source: official_codex_pricing
          pricing_scope: published_token_classes

      # v2 requires a bounded agent_role. Older series without the label stay
      # queryable as raw telemetry but are intentionally not backfilled.
      # service_namespace keeps synthetic fixtures isolated from owner usage.
      # Prefer an explicit non_cached_input series. If it is absent, derive it
      # from input because cached/cache-write tokens are reported as subsets.
      # Claude request counters already report non-overlapping token classes;
      # their request attribution labels remain on the same accounting output.
      - record: ai_agent_token_usage_total
        expr: |
          sum by (ai_agent_provider, ai_agent_product, agent_role, model_id, model_family, evidence_class, service_namespace) (
            ai_agent_turn_token_usage_sum{token_type="non_cached_input",model_id!="",agent_role!=""}
          )
          or
          (
            clamp_min(
              sum by (ai_agent_provider, ai_agent_product, agent_role, model_id, model_family, evidence_class, service_namespace) (
                ai_agent_turn_token_usage_sum{token_type="input",model_id!="",agent_role!=""}
              )
              - (
                  sum by (ai_agent_provider, ai_agent_product, agent_role, model_id, model_family, evidence_class, service_namespace) (
                    ai_agent_turn_token_usage_sum{token_type="cached_input",model_id!="",agent_role!=""}
                  )
                  or
                  sum by (ai_agent_provider, ai_agent_product, agent_role, model_id, model_family, evidence_class, service_namespace) (
                    ai_agent_turn_token_usage_sum{token_type="input",model_id!="",agent_role!=""}
                  ) * 0
                )
              - (
                  sum by (ai_agent_provider, ai_agent_product, agent_role, model_id, model_family, evidence_class, service_namespace) (
                    ai_agent_turn_token_usage_sum{token_type="cache_write_input",model_id!="",agent_role!=""}
                  )
                  or
                  sum by (ai_agent_provider, ai_agent_product, agent_role, model_id, model_family, evidence_class, service_namespace) (
                    ai_agent_turn_token_usage_sum{token_type="input",model_id!="",agent_role!=""}
                  ) * 0
                ),
              0
            )
            unless on (ai_agent_provider, ai_agent_product, agent_role, model_id, model_family, evidence_class, service_namespace)
            sum by (ai_agent_provider, ai_agent_product, agent_role, model_id, model_family, evidence_class, service_namespace) (
              ai_agent_turn_token_usage_sum{token_type="non_cached_input",model_id!="",agent_role!=""}
            )
          )
          or
          sum by (ai_agent_provider, ai_agent_product, agent_role, model_id, model_family, evidence_class, service_namespace, skill_id, mcp_server_name, mcp_tool_name) (
            ai_agent_request_token_usage_total{token_type="input",model_id!="",agent_role!=""}
          )
        labels:
          accounting_schema: v2
          usage_class: input_uncached
      - record: ai_agent_token_usage_total
        expr: |
          sum by (ai_agent_provider, ai_agent_product, agent_role, model_id, model_family, evidence_class, service_namespace) (
            ai_agent_turn_token_usage_sum{token_type="cached_input",model_id!="",agent_role!=""}
          )
          or
          sum by (ai_agent_provider, ai_agent_product, agent_role, model_id, model_family, evidence_class, service_namespace, skill_id, mcp_server_name, mcp_tool_name) (
            ai_agent_request_token_usage_total{token_type="cached_input",model_id!="",agent_role!=""}
          )
        labels:
          accounting_schema: v2
          usage_class: input_cached
      - record: ai_agent_token_usage_total
        expr: |
          sum by (ai_agent_provider, ai_agent_product, agent_role, model_id, model_family, evidence_class, service_namespace) (
            ai_agent_turn_token_usage_sum{token_type="cache_write_input",model_id!="",agent_role!=""}
          )
          or
          sum by (ai_agent_provider, ai_agent_product, agent_role, model_id, model_family, evidence_class, service_namespace, skill_id, mcp_server_name, mcp_tool_name) (
            ai_agent_request_token_usage_total{token_type="cache_write_input",model_id!="",agent_role!=""}
          )
        labels:
          accounting_schema: v2
          usage_class: input_cache_write
      - record: ai_agent_token_usage_total
        expr: |
          sum by (ai_agent_provider, ai_agent_product, agent_role, model_id, model_family, evidence_class, service_namespace) (
            ai_agent_turn_token_usage_sum{token_type="output",model_id!="",agent_role!=""}
          )
          or
          sum by (ai_agent_provider, ai_agent_product, agent_role, model_id, model_family, evidence_class, service_namespace, skill_id, mcp_server_name, mcp_tool_name) (
            ai_agent_request_token_usage_total{token_type="output",model_id!="",agent_role!=""}
          )
        labels:
          accounting_schema: v2
          usage_class: output

      - record: ai_agent_estimated_cost_usd_total
        expr: |
          ai_agent_token_usage_total{model_id!="",agent_role!="",accounting_schema="v2"}
          * on (ai_agent_provider, model_id, usage_class)
            group_left (currency, rate_card_version, rate_card_source, pricing_scope)
            (ai_agent_token_price_usd_per_million / 1000000)
        labels:
          cost_source: estimated_api_list_price

      - record: ai_agent_estimated_credit_usage_total
        expr: |
          ai_agent_token_usage_total{ai_agent_provider="openai",ai_agent_product="codex",model_id!="",agent_role!="",accounting_schema="v2"}
          * on (ai_agent_provider, model_id, usage_class)
            group_left (credit_unit, rate_card_version, rate_card_source, pricing_scope)
            (ai_agent_token_credit_per_million / 1000000)
        labels:
          credit_source: estimated_public_codex_rate_card

      - record: ai_agent_unpriced_api_token_usage_total
        expr: |
          ai_agent_token_usage_total{model_id!="",agent_role!="",accounting_schema="v2"}
          unless on (ai_agent_provider, model_id, usage_class)
          ai_agent_token_price_usd_per_million
        labels:
          estimate_scope: api_usd

      - record: ai_agent_unpriced_credit_token_usage_total
        expr: |
          ai_agent_token_usage_total{ai_agent_provider="openai",ai_agent_product="codex",model_id!="",agent_role!="",accounting_schema="v2"}
          unless on (ai_agent_provider, model_id, usage_class)
          ai_agent_token_credit_per_million
        labels:
          estimate_scope: codex_credits
