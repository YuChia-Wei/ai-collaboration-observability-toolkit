# Immutable v2 facts remain in ai-agent-cost.yml. These v3 gauges integrate sampled
# token rates at the price recorded at each evaluation; they are not billing counters.
# Snapshot read-back and local adoption: 2026-10-07T13:21:21Z, not official effective date.
# Official sources: https://developers.openai.com/api/docs/models/
# Auto-review credit policy: https://help.openai.com/en/articles/11481834
# https://help.openai.com/en/articles/11369540
# https://learn.chatgpt.com/docs/pricing and https://learn.chatgpt.com/docs/sandboxing/auto-review
# A 2m rate window smooths bursts and price boundaries. Missing samples remain missing.
# Current-evaluation price timestamp guards prevent old/new card lookback collisions on reload.
groups:
- name: ai-agent-interval-estimates-v3
  interval: 30s
  rules:
  - record: ai_agent_active_token_price_usd_per_million
    expr: vector(4) and on() (vector(time()) >= 1791379281)
    labels:
      ai_agent_provider: openai
      model_id: gpt-5.6-sol
      usage_class: input_uncached
      currency: USD
      rate_card_version: openai-api-2026-10-07
      rate_card_source: official_openai_model_pages
      pricing_scope: base_standard_context
      snapshot_read_at: '2026-10-07'
      policy_applied_from: '2026-10-07T13:21:21Z'
