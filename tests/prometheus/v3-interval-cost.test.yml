- name: real-token-counter-reset-does-not-recharge-pre-reset-lifetime
  interval: 30s
  input_series:
  - series: ai_agent_token_usage_total{ai_agent_provider="openai",ai_agent_product="codex",agent_role="primary",model_id="gpt-5.6-sol",model_family="gpt-5.6",billing_category="standard",accounting_schema="v3",usage_class="input_uncached",service_namespace="ai-collaboration-cost-fixture"}
    values: 0 300 600 900 1200 1500 50 350 650 950
  - series: ai_agent_active_token_price_usd_per_million{ai_agent_provider="openai",model_id="gpt-5.6-sol",usage_class="input_uncached",rate_card_version="test-v1",rate_card_source="synthetic",pricing_scope="test"}
    values: 4+0x16
  - series: up{job="otel-collector-exported"}
    values: 1+0x16
  promql_expr_test:
  - expr: max(ai_agent_token_usage_per_second) <= bool 10
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: min(ai_agent_estimated_cost_usd_per_second) >= bool 0
    eval_time: 3m
