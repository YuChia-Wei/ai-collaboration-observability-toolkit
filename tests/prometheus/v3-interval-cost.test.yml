# Zero-born counter warmup: 2m rate at 30/60/90/120s = 2.5/5/7.5/10 tokens/s.
# Policy activates at test time 120s; preactivation reviewer tokens remain unpriced.
# Numeric tolerance 1e-12 absorbs float arithmetic only; rate/reset/policy/missing semantics remain asserted.
rule_files:
- v3-interval-cost.rules.yml
evaluation_interval: 30s
tests:
- name: same-card-price-change-does-not-revalue-lifetime-counter
  interval: 30s
  input_series:
  - series: ai_agent_token_usage_total{ai_agent_provider="openai",ai_agent_product="codex",agent_role="primary",model_id="gpt-5.6-sol",model_family="gpt-5.6",billing_category="standard",accounting_schema="v3",usage_class="input_uncached",service_namespace="ai-collaboration-cost-fixture"}
    values: 0+300x16
  - series: ai_agent_active_token_price_usd_per_million{ai_agent_provider="openai",model_id="gpt-5.6-sol",usage_class="input_uncached",rate_card_version="test-v1",rate_card_source="synthetic",pricing_scope="test"}
    values: 4+0x5 2+0x10
  - series: ai_agent_active_token_credit_per_million{ai_agent_provider="openai",model_id="gpt-5.6-sol",usage_class="input_uncached",rate_card_version="test-v1",rate_card_source="synthetic",pricing_scope="test"}
    values: 100+0x16
  - series: up{job="otel-collector-exported"}
    values: 1+0x16
  promql_expr_test:
  - expr: abs((sum(ai_agent_estimated_cost_usd_per_second)) - 4e-05) < bool 1e-12
    eval_time: 2m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: abs((sum(ai_agent_estimated_cost_usd_per_second)) - 2e-05) < bool 1e-12
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: abs((sum(sum_over_time(ai_agent_estimated_cost_usd_per_second[4m])) * 30) - 0.006) < bool 1e-12
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: abs((sum(sum_over_time(ai_agent_estimated_cost_usd_per_second[2m])) * 30) - 0.003) < bool 1e-12
    eval_time: 2m
    exp_samples:
    - labels: '{}'
      value: 1
- name: new-version-lookback-retains-old-price-but-current-timestamp-excludes-collision
  interval: 30s
  input_series:
  - series: ai_agent_token_usage_total{ai_agent_provider="openai",ai_agent_product="codex",agent_role="primary",model_id="gpt-5.6-sol",model_family="gpt-5.6",billing_category="standard",accounting_schema="v3",usage_class="input_uncached",service_namespace="ai-collaboration-cost-fixture"}
    values: 0+300x16
  - series: ai_agent_active_token_price_usd_per_million{ai_agent_provider="openai",model_id="gpt-5.6-sol",usage_class="input_uncached",rate_card_version="test-v1",rate_card_source="synthetic",pricing_scope="test"}
    values: 4+0x5 _ _ _ _ _ _ _ _ _ _ _
  - series: ai_agent_active_token_price_usd_per_million{ai_agent_provider="openai",model_id="gpt-5.6-sol",usage_class="input_uncached",rate_card_version="test-v2",rate_card_source="synthetic",pricing_scope="test"}
    values: _ _ _ _ _ _ 2+0x10
  - series: up{job="otel-collector-exported"}
    values: 1+0x16
  promql_expr_test:
  - expr: abs((sum(ai_agent_estimated_cost_usd_per_second)) - 2e-05) < bool 1e-12
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: abs((sum(sum_over_time(ai_agent_estimated_cost_usd_per_second[4m])) * 30) - 0.006) < bool 1e-12
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: abs((sum(sum_over_time(ai_agent_estimated_cost_usd_per_second{rate_card_version="test-v1"}[4m])) * 30) - 0.0042)
      < bool 1e-12
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: abs((sum(sum_over_time(ai_agent_estimated_cost_usd_per_second{rate_card_version="test-v2"}[4m])) * 30) - 0.0018)
      < bool 1e-12
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: abs((sum(sum_over_time(ai_agent_estimated_cost_usd_per_second[2m])) * 30) - 0.003) < bool 1e-12
    eval_time: 2m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ai_agent_active_token_price_usd_per_million)
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 2
- name: trusted-auto-review-is-free-in-credit-scope-but-api-model-still-unknown
  interval: 30s
  input_series:
  - series: ai_agent_token_usage_total{ai_agent_provider="openai",ai_agent_product="codex",agent_role="approval_reviewer",model_id="unmapped",model_family="unmapped",billing_category="auto_review",accounting_schema="v3",usage_class="input_uncached",service_namespace="ai-collaboration-cost-fixture"}
