- name: one-sample-is-missing-not-zero
  interval: 30s
  input_series:
  - series: ai_agent_token_usage_total{ai_agent_provider="openai",ai_agent_product="codex",agent_role="primary",model_id="gpt-5.6-sol",model_family="gpt-5.6",billing_category="standard",accounting_schema="v3",usage_class="input_uncached",service_namespace="ai-collaboration-cost-fixture"}
