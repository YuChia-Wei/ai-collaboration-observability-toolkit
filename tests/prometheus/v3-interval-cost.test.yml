  promql_expr_test:
  - expr: sum(ai_agent_estimated_credit_usage_per_second)
    eval_time: 2m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: sum(ai_agent_estimated_cost_usd_per_second)
    eval_time: 2m
    exp_samples: []
  - expr: sum(ai_agent_unpriced_credit_token_usage_per_second)
    eval_time: 2m
    exp_samples: []
  - expr: abs((sum(ai_agent_unpriced_api_token_usage_per_second)) - 10) < bool 1e-12
    eval_time: 2m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: abs((sum(ai_agent_nonbillable_credit_token_usage_per_second)) - 10) < bool 1e-12
    eval_time: 2m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: sum(ai_agent_estimated_credit_usage_per_second)
    eval_time: 1m
    exp_samples: []
  - expr: sum(ai_agent_nonbillable_credit_token_usage_per_second)
    eval_time: 1m
    exp_samples: []
  - expr: abs((sum(ai_agent_unpriced_credit_token_usage_per_second)) - 5) < bool 1e-12
    eval_time: 1m
    exp_samples:
    - labels: '{}'
      value: 1
